[package]
name = "minimaxer"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
criterion = "0.5"
test-log = "0.2.18"

[[bench]]
name = "search"
harness = false


[profile.bench]
debug = true

[dependencies]
atomic_float = { version = "1.1.0", optional = true }
log = "0.4.27"
rand = { version = "0.8", default-features = false, features = ["small_rng"] }
rayon = { version = "1.11.0", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# `thread_rng` needs the std entropy source, which wasm does not have.
rand = { version = "0.8", features = ["small_rng", "std", "std_rng"] }

[features]
# Fan the root out across a rayon pool. Off for wasm, which has no threads
# unless the host opts into shared memory.
default = ["parallel"]
parallel = ["dep:rayon", "dep:atomic_float"]
